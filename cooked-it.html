<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share What You Made — MealWheelIQ</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<style>
:root{
  --coral:#C94B2A;--coral-dark:#A83D22;
  --green:#2A6B4A;--green-pale:#EAF3EE;
  --ink:#1C1714;--ink2:#4A3F38;--ink3:#8C7B72;
  --cream:#FAF7F2;--card:#FFFFFF;--border:#E2D9CE;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem}
.card{background:var(--card);border-radius:20px;padding:2rem 1.5rem;max-width:440px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.07);text-align:center}
h1{font-family:Georgia,serif;font-size:1.5rem;margin-bottom:.4rem}
p.sub{color:var(--ink3);font-size:14px;margin-bottom:1.5rem;line-height:1.5}
#file-input{display:none}
.snap-btn{background:var(--coral);color:white;border:none;border-radius:16px;padding:1.1rem;font-size:16px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.snap-btn:disabled{opacity:.6;cursor:not-allowed}
.secondary-btn{background:var(--ink);color:white;border:none;border-radius:16px;padding:1.1rem;font-size:16px;font-weight:700;cursor:pointer;width:100%;text-decoration:none;display:block;margin-top:.7rem}
.preview-img{width:100%;border-radius:14px;margin:1rem 0;max-height:320px;object-fit:cover}
.success-box{text-align:center;background:var(--green-pale);border-radius:14px;padding:1.1rem 1.2rem;margin:1.2rem 0}
.success-box .label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--green);margin-bottom:.4rem}
.success-box .msg{font-size:14px;color:var(--ink2);line-height:1.5}
.status-msg{font-size:14px;color:var(--ink3);margin:1rem 0}
.error-msg{font-size:14px;color:#C0392B;margin:1rem 0}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--coral);border-radius:50%;animation:spin 0.8s linear infinite;margin:1.5rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card" id="card">
  <h1>📸 Share What You Made</h1>
  <p class="sub" id="sub-text">Show off tonight's dinner — snap a photo of the finished plate.</p>

  <div id="pre-upload-state">
    <input type="file" id="file-input" accept="image/*" capture="environment">
    <button class="snap-btn" onclick="document.getElementById('file-input').click()">📷 Take or Choose a Photo</button>
  </div>

  <div id="uploading-state" style="display:none">
    <div class="spinner"></div>
    <p class="status-msg">Uploading your photo...</p>
  </div>

  <div id="result-state" style="display:none">
    <img id="preview-img" class="preview-img">
    <div class="success-box">
      <div class="label">Nice work! 🎉</div>
      <div class="msg">Your photo is saved to your MealWheelIQ history. Want to show it off?</div>
      <div class="points-msg" id="points-msg" style="display:none;margin-top:.6rem;font-weight:700;color:var(--coral);font-size:14px"></div>
    </div>
    <button class="snap-btn" id="share-btn" onclick="sharePhoto()">📤 Share This</button>
    <a href="https://mealwheeliq.com/app.html" class="secondary-btn">Back to MealWheelIQ →</a>
  </div>

  <div id="error-state" style="display:none">
    <p class="error-msg" id="error-text"></p>
    <button class="snap-btn" onclick="location.reload()">Try Again</button>
  </div>
</div>

<script>
const API = 'https://api.mealwheeliq.com';
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
let lastFile = null;
let lastRecipeName = '';

if (!token) {
  showError('This link is missing some information. Please use the link from your email or the app.');
}

document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  lastFile = file;

  document.getElementById('pre-upload-state').style.display = 'none';
  document.getElementById('uploading-state').style.display = 'block';

  try {
    const base64 = await compressImage(file, 1280, 0.8);

    const resp = await fetch(`${API}/cooked-it/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64, mediaType: 'image/jpeg' })
    });
    const data = await resp.json();

    if (!resp.ok) {
      showError(data.error || 'Something went wrong. Please try again.');
      return;
    }

    lastRecipeName = data.recipeName || '';
    document.getElementById('preview-img').src = 'data:image/jpeg;base64,' + base64;
    if (lastRecipeName) {
      document.querySelector('.success-box .msg').textContent =
        `Your photo of ${lastRecipeName} is saved to your MealWheelIQ history. Want to show it off?`;
    }
    if (data.pointsAwarded) {
      const pointsEl = document.getElementById('points-msg');
      pointsEl.textContent = `+${data.pointsAwarded} points toward your chef rank 🧑‍🍳`;
      pointsEl.style.display = 'block';
    }
    document.getElementById('uploading-state').style.display = 'none';
    document.getElementById('result-state').style.display = 'block';
  } catch (err) {
    showError('Could not reach the server. Please check your connection and try again.');
  }
});

// Same resize/compress approach as the pantry scan flow — keeps upload fast
// regardless of the phone's native camera resolution.
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) {
        height = Math.round(height * (maxDim / width));
        width = maxDim;
      } else if (height > maxDim) {
        width = Math.round(width * (maxDim / height));
        height = maxDim;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve(dataUrl.split(',')[1]); // base64 without prefix
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function sharePhoto() {
  const text = lastRecipeName
    ? `I made ${lastRecipeName} tonight with MealWheelIQ! 🍽️`
    : `Made dinner tonight with MealWheelIQ! 🍽️`;

  try {
    // Web Share API Level 2 — share the actual photo file when the browser supports it
    if (navigator.canShare && lastFile && navigator.canShare({ files: [lastFile] })) {
      await navigator.share({ files: [lastFile], title: 'MealWheelIQ', text });
      return;
    }
    if (navigator.share) {
      await navigator.share({ title: 'MealWheelIQ', text, url: 'https://mealwheeliq.com' });
      return;
    }
    await navigator.clipboard.writeText(text + ' — mealwheeliq.com');
    alert('Copied! Paste it wherever you want to share.');
  } catch (e) {
    // User cancelled the native share sheet — not an error worth surfacing
  }
}

function showError(msg) {
  document.getElementById('pre-upload-state').style.display = 'none';
  document.getElementById('uploading-state').style.display = 'none';
  document.getElementById('result-state').style.display = 'none';
  document.getElementById('error-text').textContent = msg;
  document.getElementById('error-state').style.display = 'block';
}
</script>
</body>
</html>
